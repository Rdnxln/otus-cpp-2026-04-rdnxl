name: 'C++ CI'

on:
  push:
    branches:
      - master
      - feature/github_actions
      - HW02
      - HW03
      - HW04

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Обновлено до v4 (использует Node.js 20)
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libboost-test-dev doxygen graphviz -y

      - name: Configure CMake
        run: cmake . -DPATCH_VERSION=${{ github.run_number }} -DWITH_BOOST_TEST=ON

      - name: Build
        run: cmake --build .

      - name: Run Tests
        run: cmake --build . --target test

      - name: Package
        run: cmake --build . --target package

      # Генерация документации (только для HW04)
      - name: Generate Documentation
        if: github.ref == 'refs/heads/HW04'
        run: doxygen Doxyfile

      # Загрузка артефакта страниц (только для HW04)
      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/HW04'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/html

      # Деплой на GitHub Pages (только для HW04)
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/HW04'
        id: deployment
        uses: actions/deploy-pages@v4

      # Создание релиза (выполняется для всех веток из on.push.branches)
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Release 0.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./print-ip-0.0.${{ github.run_number }}-Linux.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
